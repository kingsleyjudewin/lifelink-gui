<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=800, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>LifeLink — Iris Enrollment</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="theme.css"/>
</head>
<body>
<div class="screen">

  <header class="topbar">
    <div class="topbar-left"><span class="status-dot live"></span>TRAUMA / BAY 01</div>
    <div class="brand">LIFELINK</div>
    <div class="clock mono" id="clock">05:58</div>
  </header>

  <div class="modulebar">
    <span><strong>IRIS ENROLLMENT</strong> · STEP 2 OF 3</span>
    <span>NIR DUAL OPTICS 850NM ACTIVE</span>
  </div>

  <main class="main px-3 py-2 flex gap-3" style="min-height:0;">

    <div class="viewport" style="flex:1.05;">
      <div style="width:130px;height:130px;border-radius:50%;border:1.5px dashed rgba(255,255,255,0.5);display:flex;align-items:center;justify-content:center;">
        <div style="width:78px;height:78px;border-radius:50%;border:1.5px solid rgba(120,200,120,0.85);display:flex;align-items:center;justify-content:center;">
          <div style="width:26px;height:26px;border-radius:50%;background:#0d0f0f;border:1px solid rgba(255,255,255,0.6);"></div>
        </div>
      </div>
      <span class="corner" style="top:8px;left:8px;border-top:2px solid;border-left:2px solid;"></span>
      <span class="corner" style="top:8px;right:8px;border-top:2px solid;border-right:2px solid;"></span>
      <span class="corner" style="bottom:8px;left:8px;border-bottom:2px solid;border-left:2px solid;"></span>
      <span class="corner" style="bottom:8px;right:8px;border-bottom:2px solid;border-right:2px solid;"></span>
      <div class="hint">ALIGN PUPIL TO RETICLE</div>
    </div>

    <div class="flex flex-col gap-2" style="flex:0.95; min-width:0;">

      <div class="card px-2 py-2">
        <div class="card-title mb-1">Target</div>
        <div class="flex items-center justify-between">
          <span style="font-size:15px;font-weight:700;">Right Iris (OD)</span>
          <span class="chip chip-success">READY</span>
        </div>
      </div>

      <div class="card px-2 py-2" style="flex:1;">
        <div class="card-title mb-1">Optical Sector Progression</div>
        <div class="flex gap-2">
          <div class="flex-1 rounded px-2 py-2" style="background:var(--success-container);">
            <div style="font-size:9px;color:var(--success);font-weight:700;">OS · LEFT</div>
            <div style="font-size:13px;font-weight:700;">COMPLETE</div>
            <div class="mono" style="font-size:9px;color:var(--success);">98%</div>
          </div>
          <div class="flex-1 rounded px-2 py-2" style="background:var(--surface-container-high);">
            <div style="font-size:9px;color:var(--on-surface-variant);font-weight:700;">OD · RIGHT</div>
            <div style="font-size:13px;font-weight:700;">SCANNING</div>
            <div class="mono" style="font-size:9px;color:var(--on-surface-variant);">QUEUED</div>
          </div>
        </div>
        <div class="divider my-2"></div>
        <div class="flex justify-between mono" style="font-size:9px;color:var(--on-surface-variant);">
          <span>FOCUS LOCK</span><span style="color:var(--on-surface);font-weight:700;">100%</span>
        </div>
        <div class="flex justify-between mono mt-1" style="font-size:9px;color:var(--on-surface-variant);">
          <span>QUALITY</span><span style="color:var(--on-surface);font-weight:700;">95% NIST</span>
        </div>
      </div>

    </div>

  </main>

  <div class="bottombar">
    <button class="btn btn-ghost">Back</button>
    <button class="btn btn-ghost">Switch Sensor</button>
    <button class="btn btn-primary">Capture Iris</button>
  </div>

</div>
<script>
  function tick(){ document.getElementById('clock').textContent = new Date().toTimeString().slice(0,5); }
  tick(); setInterval(tick, 30000);
</script>
</body>
</html>
