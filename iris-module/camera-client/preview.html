<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iris Camera Preview</title>
<!-- Dev helper: open this file in a browser next to the LifeLink GUI to see
     what the iris camera sees while a scan runs. Polls the backend's
     in-memory preview (nothing is stored). -->
<style>
  :root { --bg: #111315; --fg: #D9D9D9; --ok: #3A7A3A; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px monospace; }
  .wrap { position: relative; max-width: 960px; margin: 16px auto; padding: 0 16px; }
  .frame { position: relative; background: #050505; aspect-ratio: 16 / 9; border-radius: 4px; overflow: hidden; }
  img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .box { position: absolute; left: 15%; top: 15%; width: 70%; height: 70%;
         border: 2px dashed var(--ok); border-radius: 4px; pointer-events: none; }
  #status { margin: 8px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div id="status">Waiting for the iris camera… (starts when a scan is requested in the GUI)</div>
  <div class="frame"><img id="img" alt="Iris camera preview"><div class="box"></div></div>
  <p>Put your eye inside the green box — only that area is used.</p>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const base = params.get('backend') || 'http://localhost:3000';
  const device = params.get('device') || 'iris-cam-1';
  const img = document.getElementById('img');
  const status = document.getElementById('status');
  let last = 0;
  // A plain <img> load avoids CORS; the timestamp defeats caching.
  const probe = new Image();
  probe.onload = () => { if (probe.naturalWidth) { img.src = probe.src; last = Date.now(); } };
  setInterval(() => {
    probe.src = `${base}/api/devices/${encodeURIComponent(device)}/preview?t=${Date.now()}`;
    status.textContent = !last ? 'Waiting for the iris camera…'
      : Date.now() - last < 800 ? 'LIVE — put your eye inside the green box'
      : 'Analysing this frame — hold position';
  }, 250);
</script>
</body>
</html>
